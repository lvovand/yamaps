         "businessComment": {
          "text": "Здравствуйте! Мы рады, что ваше первое знакомство с Termoland оставило столько приятных впечатлений. Спасибо, что отметили удобные раздевалки, душевые и наличие камер хранения — мы стараемся сделать ваше пребывание максимально комфортным. Здорово, что вам понравилась зона с глинами и хамам, а также разнообразие меню и наличие детской анимации. Обязательно учтем ваше замечание про обувь для уличного бассейна. Надеемся, ваши будущие визиты будут такими же приятными и наполненными отдыхом. С уважением, Термолэнд.",
          "updatedTime": "2026-03-16T04:04:06.041Z"
         },
         "reviewId": "HO8jmZr1gccMlyFCDrKvw6kdkoPtkezK-",

         "author": {
          "name": "Альбина Троян",

          "professionLevel": "Знаток города 12 уровня",

         "text": "Ну вот мы и в “Termoland “ 💦 Termoland | Пулковский | Санкт-Петербург \n\nДвух часов для первого знакомства вполне хватает,чтобы попробовать все парные и бассейн.\n\nПеред посещением читала отзывы,много негативных ,но мне понравились -хорошие душевые с гелем в диспенсере,мощные фены,удобные раздевалки на магнитном ключе и внутри банного комплекса камеры хранения для телефонов и ценных вещей.\n\nМожно взять с собой перекус и оставить рядом с лежаками , также около выхода в зону басссейнов -чай заварной(какой-то вьетнамский крутой был) и вода бесплатно ,это большой респект! 👍🏽 \n\nЗаманчивая зона уличного бассейна,но там был сильный ветер и солнце поэтому искупались и убежали,в прямом смысле теряя тапки🤣 \nОбязательно берите резиновые ,мы брали на ВБ одноразовые, но в них безумно скользко,и они улетают на ветру.\n\nТакже понравилась зона глин-и Сакская и Ейская,несколько видов,намазались,погрелись в хамаме и тут же смыли ,удобно хорошо,кожа-рожа довольна 😊 \n\nПромокод брали в телеграм бот при оплате онлайн удобно,скидка 10% при первом посещении,от 5 человек и вечернее время.В очереди стояли 5 минут ,все объяснили и мы попали в царство пара 💨 \n\nВсе свежее,комфортно находиться ,понравилась парная «Сталевар».\nНа коллективные парения не попала ,но и не стремилась ,есть детская анимация ,развлекают маленьких и там еще парная кино-булочная,там мультики включают,не жарко.\nМеню разное -фреши и смузи 300-400,кислородные коктейли от 265 р и тд ,фри 250,пицца слайсами,самое дорогое блюдо-свиные ребра 700 р,пиво 250 что ли 🍻 \n\nБассейн внутри есть совсем малышковый и для всех ,очень теплый ,всякие джакузи-бурляшки тоже есть.\n\nМожно и СПА совместить-стоят кабинки,оттуда классно пахнет маслом😌\n\nОднозначно советую ,летом будет не протолкнуться ✌️",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "İşte buradayız “Termoland \" 💦 Termoland / Pulkovsky / St. Petersburg'dayız \n\nİlk buluşmanız için iki saat, tüm buhar odalarını ve havuzu denemek için yeterlidir.\n\nZiyaretimden önce pek çok olumsuz yorum okudum ama hoşuma gitti - dağıtıcıda jel bulunan iyi duşlar, güçlü saç kurutma makineleri, manyetik anahtarlı uygun soyunma odaları ve banyo kompleksinin içinde telefonlar ve değerli eşyalar için depolama kameraları.\n\nYanınıza bir atıştırmalık alıp şezlongların yanında, ayrıca bassein bölgesine çıkmanın yanında bırakabilirsiniz - muhallebi çayı (bir çeşit Vietnam harikaydı) ve suyu bedavaya bırakabilirsiniz, bu büyük bir saygıdır! 👍🏽 \n\nSokak havuzunun cazip alanı, ancak kuvvetli rüzgarlar ve güneş vardı, bu yüzden yüzüp kaçtılar, kelimenin tam anlamıyla spor ayakkabılarını kaybettiler \nLastiklerinizi aldığınızdan emin olun, Dünya Bankası'na tek kullanımlık olanları götürdük, ancak içlerinde delicesine kaygan ve rüzgarda uçuyorlar.\n\nKil ve Saka ve Yeiskay bölgesini de beğendim, birkaç çeşit yayıldık, hamamda ısındık ve hemen yıkandık, uygun bir şekilde, yüzümden memnun kaldım \n\nOnline ödeme yaparken uygun bir şekilde telegram'da bir bot promosyon kodu aldılar, ilk ziyarette 5 kişiden ve akşam saatlerinde% 10 indirim yaptılar.Sırada 5 dakika vardı, her şeyi açıkladılar ve çiftin krallığına girdik \n\nHer şey taze, rahat olmak, buharlı «Çelik İşçisini» beğendim.\nKolektif yükselişe geçmedim, ama istemedim, çocuk animasyonu var, küçükleri eğlendiriyorlar ve hala buharlı bir film fırını var, karikatürleri açıyorlar, sıcak değil.\nMenü farklıdır - taze ve smoothie'ler 300-400, 265 r'den oksijen kokteylleri vb., patates kızartması 250, dilimli pizzalar, en pahalı yemek domuz kaburgaları 700 r, bira 250'dir. \n\nİçeride çok küçük bir havuz var ve herkes için çok sıcak, her türlü jakuzi de var.\n\nSpayı birleştirebilirsiniz - kabinler vardır, oradan harika yağ kokuyor\n\nKesinlikle tavsiye ederim, yaz aylarında zorlanmayacak ✌️"

         "text": "Отмечала др. Задумка классная. С маленьким детьми не советую идти, будете в лягушатнике дежурить с ними вместо спа) хотя программа и для них есть. Выиграла в розыгрыше сертификат на безлимитное посещение, пойду без ребёнка.",

        {
         "businessComment": {
          "text": "Здравствуйте. Мы рады, что ваше время в Термолэнд оказалось наполненным приятными впечатлениями и позволило почувствовать себя так, будто вы побывали в мини-отпуске. Нам приятно, что разнообразие зон отдыха и атмосфера комплекса подарили вам удовольствие и возможность по-настоящему расслабиться. Мы учли ваши рекомендации по времени посещения и передали информацию руководству для улучшения сервиса. Будем рады видеть вас снова и создавать для вас комфортные условия для отдыха и восстановления.\n\nС уважением, Термолэнд.",

          "avatarUrl": "https://avatars.mds.yandex.net/get-yapic/65952/0d-6/{size}",
          "professionLevel": "Знаток города 4 уровня",

          "isSubscribed": false
         },
         "text": "Ощущение, что сходила в мини-отпуск! Впечатлений масса. Во-первых, очень много зон: купели с разной температурой, классные хаммамы и парные . Впечатлила комната с грязями — обмазалась, отдохнула в специальной парной, кожа после этого просто бархатная . Есть уличный бассейн, плавать в нем в прохладную погоду — отдельный кайф . Цены в кафе приятно удивили. Из советов — берите минимум 3-4 часа, два часа пролетят незаметно, и учтите, что время отсчитывается с момента прохода через турникет, а не с начала купания. Вернусь обязательно!",
         "textLanguage": "ru",
         "textTranslations": {
          "tr": "Mini tatile çıkıyormuşum gibi hissediyorum! İzlenimler çoktur. İlk olarak, birçok bölge var: farklı sıcaklıklara sahip yazı tipleri, havalı hamamlar ve buhar odaları. Çamurlu odadan etkilendim — bulaştım, özel bir buhar odasında dinlendim, bundan sonra cilt sadece kadifemsi. Dışarıda bir yüzme havuzu var, serin havalarda yüzmek ayrı bir yüksekliktir. Kafedeki fiyatlar hoş bir sürpriz oldu. Tavsiyelerden - en az 3-4 saat alın, iki saat fark edilmeden uçacak ve zamanın banyoya başladığından değil turnikeden geçtiği andan itibaren sayıldığını unutmayın. Kesinlikle geri döneceğim!"
